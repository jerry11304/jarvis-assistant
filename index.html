
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b15">
<title>J.A.R.V.I.S.</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #050b15;
  color: #d9f3ff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 22px;
  text-align: center;
  border-bottom: 1px solid #123b58;
  letter-spacing: 4px;
  color: #45caff;
}

.core {
  width: 150px;
  height: 150px;
  margin: 45px auto 20px;
  border: 3px solid #31caff;
  border-radius: 50%;
  box-shadow: 0 0 20px #168bff,
              inset 0 0 25px #168bff;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 3s infinite;
}

.core span {
  font-size: 43px;
  color: #8deaff;
  text-shadow: 0 0 20px #21bfff;
}

@keyframes pulse {
  50% {
    box-shadow: 0 0 45px #168bff,
                inset 0 0 35px #168bff;
  }
}

.status {
  text-align: center;
  color: #48caff;
  letter-spacing: 2px;
  margin-bottom: 35px;
}

main {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

#chat {
  height: 280px;
  overflow-y: auto;
  background: #091625;
  border: 1px solid #145078;
  border-radius: 12px;
  padding: 15px;
}

.message {
  margin: 12px 0;
  line-height: 1.5;
}

.jarvis { color: #55cfff; }
.user { color: white; text-align: right; }

.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

input {
  flex: 1;
  min-width: 0;
  background: #102337;
  border: 1px solid #2387bd;
  color: white;
  border-radius: 8px;
  padding: 14px;
}

button {
  background: #087eb5;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 12px;
  font-weight: bold;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.actions button { flex: 1; }

footer {
  text-align: center;
  color: #53778e;
  padding: 25px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>J.A.R.V.I.S.</header>

<div class="core">
  <span>J</span>
</div>

<div class="status">SYSTEM ONLINE</div>

<main>
  <div id="chat">
    <div class="message jarvis">
      J.A.R.V.I.S.: Guten Tag, Herr Kathmann.
      Mein System ist gestartet.
      Wie kann ich Ihnen helfen?
    </div>
  </div>

  <div class="controls">
    <input id="message"
      placeholder="Nachricht an J.A.R.V.I.S.">
    <button onclick="send()">Senden</button>
  </div>

  <div class="actions">
    <button onclick="saveMemory()">Merken</button>
    <button onclick="showMemory()">Gedächtnis</button>
    <button onclick="deleteMemory()">Löschen</button>
  </div>
</main>

<footer>
  J.A.R.V.I.S. PERSONAL ASSISTANT · VERSION 1.0
</footer>


<script>
const chat = document.getElementById("chat");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function think(text) {
  const q = text.toLowerCase();

  if (q.includes("hallo") || q.includes("guten tag")) {
    return "Guten Tag, Herr Kathmann. Wie kann ich Ihnen helfen?";
  }

  if (q.includes("wie heißt du")) {
    return "Mein Name ist J.A.R.V.I.S. – Ihr persönlicher Assistent.";
  }

  if (q.includes("wie geht es dir")) {
    return "Alle Systeme arbeiten im normalen Betriebszustand.";
  }

  if (q.includes("wer bist du")) {
    return "Ich bin J.A.R.V.I.S., Ihr digitaler Assistent.";
  }

  if (q.includes("uhrzeit")) {
    return "Die aktuelle Gerätezeit ist " +
      new Date().toLocaleTimeString("de-DE") + ".";
  }

  if (q.includes("datum")) {
    return "Heute ist der " +
      new Date().toLocaleDateString("de-DE") + ".";
  }

  if (q.includes("gedächtnis")) {
    showMemory();
    return "Ich habe Ihr Gedächtnis geöffnet.";
  }

  if (q.includes("hilfe")) {
    return "Ich kann Sie begrüßen, Datum und Uhrzeit nennen " +
      "und Informationen lokal speichern.";
  }

  if (q.includes("danke")) {
    return "Sehr gerne, Herr Kathmann.";
  }

  return "Ich habe Ihre Nachricht verstanden. " +
    "Meine echte KI-Anbindung ist noch nicht eingerichtet. " +
    "Ich werde diese Funktion später erweitern.";
}

function send() {
  const input = document.getElementById("message");
  const text = input.value.trim();

  if (!text) return;

  addMessage("Sie: " + text, "user");
  input.value = "";

  const answer = think(text);

  addMessage("J.A.R.V.I.S.: " + answer, "jarvis");
}

function saveMemory() {
  const input = document.getElementById("message");
  const value = input.value.trim();

  if (!value) {
    addMessage("J.A.R.V.I.S.: Bitte Text eingeben.",
      "jarvis");
    return;
  }

  const memories = JSON.parse(
    localStorage.getItem("jarvisMemory") || "[]"
  );

  memories.push(value);

  localStorage.setItem(
    "jarvisMemory",
    JSON.stringify(memories)
  );

  input.value = "";

  addMessage("J.A.R.V.I.S.: Information gespeichert.",
    "jarvis");
}

function showMemory() {
  const memories = JSON.parse(
    localStorage.getItem("jarvisMemory") || "[]"
  );

  addMessage(
    "J.A.R.V.I.S.: " +
    (memories.length
      ? memories.join(" | ")
      : "Mein Gedächtnis ist noch leer."),
    "jarvis"
  );
}

function deleteMemory() {
  localStorage.removeItem("jarvisMemory");

  addMessage("J.A.R.V.I.S.: Gedächtnis gelöscht.",
    "jarvis");
}

document.getElementById("message").addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") send();
  }
);
</script>


</body>
</html>
