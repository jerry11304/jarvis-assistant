
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061421">
<title>J.A.R.V.I.S. – Personal Assistant</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#061421;color:#d9f5ff;
 font-family:Arial,sans-serif;
}
.app{max-width:900px;margin:auto;padding:18px}
header{text-align:center;padding:18px}
h1{letter-spacing:9px;color:#35d5ff;text-shadow:0 0 15px #008cff}
#status{font-size:13px;color:#68e9a8}
.core{
 width:155px;height:155px;margin:20px auto;
 border:4px solid #27caff;border-radius:50%;
 display:grid;place-items:center;
 box-shadow:0 0 30px #009dff,inset 0 0 30px #009dff;
 animation:pulse 3s infinite;
}
.core span{font-size:45px;font-weight:bold}
@keyframes pulse{50%{box-shadow:0 0 55px #00bfff,inset 0 0 45px #00bfff}}
.chat{
 height:390px;overflow-y:auto;padding:14px;
 background:#091d2e;border:1px solid #155273;
 border-radius:12px;
}
.message{padding:12px;margin:10px 0;border-radius:9px;white-space:pre-wrap;line-height:1.5}
.user{background:#123e59;text-align:right}
.jarvis{background:#102c40}
.controls{display:flex;gap:8px;margin-top:12px}
input{
 flex:1;min-width:0;padding:14px;
 background:#10283b;color:white;
 border:1px solid #28799b;border-radius:8px;font-size:16px
}
button{
 padding:12px;background:#087da8;color:white;
 border:0;border-radius:8px;font-size:14px
}
button:active{background:#19b7e7}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tools button{background:#17384d}
footer{text-align:center;color:#527d91;margin:20px;font-size:12px}
</style>
</head>

<body>
<div class="app">
<header>
<h1>J.A.R.V.I.S.</h1>
<div id="status">SYSTEM STARTET</div>
</header>

<div class="core"><span>J</span></div>

<div class="chat" id="chat">
<div class="message jarvis">
Guten Abend, Herr Kathmann. J.A.R.V.I.S. ist bereit.
</div>
</div>

<div class="controls">
<input id="input" placeholder="Nachricht an J.A.R.V.I.S. ...">
<button id="sendButton">Senden</button>
<button id="micButton">🎙️</button>
</div>

<div class="tools">
<button id="memoryButton">Gedächtnis</button>
<button id="saveButton">Erinnerung speichern</button>
<button id="clearButton">Chat löschen</button>
<button id="stopButton">Sprache stoppen</button>
</div>

<footer>J.A.R.V.I.S. PERSONAL ASSISTANT</footer>
</div>

<script>
"use strict";

const API="https://jarvis-assistant.jeremy-rohlfs.workers.dev";

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const status=document.getElementById("status");

let history=readStorage("jarvisChat",[]);
let memory=readStorage("jarvisMemory",[]);
let busy=false;

function readStorage(key,fallback){
 try{
  const value=JSON.parse(localStorage.getItem(key));
  return value===null?fallback:value;
 }catch{
  return fallback;
 }
}

function saveStorage(){
 localStorage.setItem("jarvisChat",JSON.stringify(history));
 localStorage.setItem("jarvisMemory",JSON.stringify(memory));
}

function addMessage(text,type="jarvis"){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function renderHistory(){
 chat.innerHTML="";
 history.forEach(item=>addMessage(item.text,item.type));
}

function speak(text){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="de-DE";
 utterance.rate=1;
 speechSynthesis.speak(utterance);
}

function stopSpeaking(){
 if("speechSynthesis" in window)speechSynthesis.cancel();
}

async function checkStatus(){
 try{
  const response=await fetch(API+"/api/status");
  if(!response.ok)throw new Error();
  const data=await response.json();
  status.textContent=data.online?"SYSTEM ONLINE":"SYSTEM OFFLINE";
 }catch{
  status.textContent="VERBINDUNG FEHLGESCHLAGEN";
 }
}

async function send(){
 const text=input.value.trim();
 if(!text||busy)return;

 input.value="";
 history.push({text,type:"user"});
 addMessage(text,"user");
 saveStorage();

 busy=true;
 status.textContent="J.A.R.V.I.S. DENKT ...";

 try{
  const response=await fetch(API+"/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:text,
    history:history.slice(-20),
    memory:memory,
    assistant:"J.A.R.V.I.S.",
    user:"Herr Kathmann"
   })
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.message||"KI-Dienst nicht verfügbar.");
  }

  const answer=data.reply||data.response;

  if(typeof answer!=="string"||!answer.trim()){
   throw new Error("Keine gültige KI-Antwort erhalten.");
  }

  history.push({text:answer,type:"jarvis"});
  addMessage(answer);
  saveStorage();
  speak(answer);
  status.textContent="SYSTEM ONLINE";

 }catch(error){
  const message="Herr Kathmann, mein KI-Dienst ist momentan nicht verfügbar. Die Verbindung zum Worker funktioniert, aber ein KI-Modell ist noch nicht angeschlossen.";
  history.push({text:message,type:"jarvis"});
  addMessage(message);
  saveStorage();
  status.textContent="KI-DIENST NICHT VERFÜGBAR";
 }finally{
  busy=false;
 }
}

function saveMemory(){
 const text=prompt("Was soll ich mir merken?");
 if(!text||!text.trim())return;
 memory.push(text.trim());
 saveStorage();
 addMessage("Erinnerung lokal gespeichert, Herr Kathmann.");
}

function showMemory(){
 if(memory.length===0){
  addMessage("Mein Gedächtnis ist noch leer.");
  return;
 }
 addMessage("Gespeicherte Erinnerungen:\n"+memory.map((m,i)=>(i+1)+". "+m).join("\n"));
}

function clearChat(){
 if(!confirm("Chatverlauf wirklich löschen?"))return;
 history=[];
 localStorage.removeItem("jarvisChat");
 chat.innerHTML="";
 addMessage("Chatverlauf gelöscht. Ich bin bereit.");
}

function listen(){
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Recognition){
  addMessage("Dieser Browser unterstützt keine Spracherkennung.");
  return;
 }

 const recognition=new Recognition();
 recognition.lang="de-DE";
 recognition.interimResults=false;
 recognition.onstart=()=>status.textContent="ICH HÖRE ZU";
 recognition.onresult=event=>{
  input.value=event.results[0][0].transcript;
  send();
 };
 recognition.onerror=()=>status.textContent="SPRACHERKENNUNG FEHLGESCHLAGEN";
 recognition.onend=()=>checkStatus();
 recognition.start();
}

document.getElementById("sendButton").addEventListener("click",send);
document.getElementById("micButton").addEventListener("click",listen);
document.getElementById("memoryButton").addEventListener("click",showMemory);
document.getElementById("saveButton").addEventListener("click",saveMemory);
document.getElementById("clearButton").addEventListener("click",clearChat);
document.getElementById("stopButton").addEventListener("click",stopSpeaking);

input.addEventListener("keydown",event=>{
 if(event.key==="Enter")send();
});

renderHistory();
checkStatus();
</script>
</body>
</html>
