
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050b15;
  color: #d9f3ff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 22px;
  text-align: center;
  border-bottom: 1px solid #123b58;
  letter-spacing: 4px;
  color: #45caff;
  font-size: 24px;
}

.core {
  width: 150px;
  height: 150px;
  margin: 40px auto 20px;
  border: 3px solid #31caff;
  border-radius: 50%;
  box-shadow: 0 0 20px #168bff,
              inset 0 0 25px #168bff;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 3s infinite;
}

.core span {
  font-size: 43px;
  color: #8deaff;
  text-shadow: 0 0 20px #21bfff;
}

@keyframes pulse {
  50% {
    box-shadow: 0 0 45px #168bff,
                inset 0 0 35px #168bff;
  }
}

.status {
  text-align: center;
  color: #48caff;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

main {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

#chat {
  height: 300px;
  overflow-y: auto;
  background: #091625;
  border: 1px solid #145078;
  border-radius: 12px;
  padding: 15px;
}

.message {
  margin: 12px 0;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.jarvis {
  color: #55cfff;
}

.user {
  color: white;
  text-align: right;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

input {
  flex: 1;
  min-width: 0;
  background: #102337;
  border: 1px solid #2387bd;
  color: white;
  border-radius: 8px;
  padding: 14px;
}

button {
  background: #087eb5;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 12px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  background: #045477;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

.actions button {
  flex: 1 1 40%;
}

footer {
  text-align: center;
  color: #53778e;
  padding: 25px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>J.A.R.V.I.S.</header>

<div class="core">
  <span>J</span>
</div>

<div class="status" id="systemStatus">
  SYSTEM ONLINE
</div>

<main>

  <div id="chat">
    <div class="message jarvis">
      J.A.R.V.I.S.: Guten Tag, Herr Kathmann.
      Alle lokalen Systeme sind bereit.
      Wie kann ich Ihnen helfen?
    </div>
  </div>

  <div class="controls">
    <input id="message"
      placeholder="Nachricht an J.A.R.V.I.S.">
    <button onclick="send()">Senden</button>
    <button onclick="listen()">🎙️</button>
  </div>

  <div class="actions">
    <button onclick="saveMemory()">Merken</button>
    <button onclick="showMemory()">Gedächtnis</button>
    <button onclick="deleteMemory()">Löschen</button>
    <button onclick="jarvisStatus()">Systemstatus</button>
    <button onclick="stopSpeaking()">Stimme stoppen</button>
  </div>

</main>

<footer>
  J.A.R.V.I.S. PERSONAL ASSISTANT · VERSION 2.0
</footer>

<script>

const chat = document.getElementById("chat");

let recognition = null;
let listening = false;

// NACHRICHTEN ANZEIGEN

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// SPRACHAUSGABE

function speak(text) {
  if (!("speechSynthesis" in window)) {
    addMessage(
      "J.A.R.V.I.S.: Sprachausgabe nicht verfügbar.",
      "jarvis"
    );
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "de-DE";
  speech.rate = 0.95;
  speech.pitch = 0.85;

  window.speechSynthesis.speak(speech);
}

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}

// LOKALE ANTWORTEN

function think(text) {
  const q = text.toLowerCase();

  if (q.includes("hallo") || q.includes("guten tag")) {
    return "Guten Tag, Herr Kathmann. Wie kann ich Ihnen helfen?";
  }

  if (q.includes("wer bist du") || q.includes("wie heißt du")) {
    return "Ich bin J.A.R.V.I.S., Ihr persönlicher digitaler Assistent.";
  }

  if (q.includes("wie geht es dir")) {
    return "Alle Systeme arbeiten im normalen Betriebszustand.";
  }

  if (q.includes("uhrzeit") || q.includes("wie spät")) {
    return "Es ist " +
      new Date().toLocaleTimeString("de-DE") + " Uhr.";
  }

  if (q.includes("datum") || q.includes("welcher tag")) {
    return "Heute ist der " +
      new Date().toLocaleDateString("de-DE") + ".";
  }

  if (q.includes("hilfe")) {
    return "Ich kann Sie begrüßen, Datum und Uhrzeit nennen und Informationen lokal speichern.";
  }

  if (q.includes("gedächtnis")) {
    showMemory();
    return "Ich habe Ihr Gedächtnis geöffnet.";
  }

  if (q.includes("systemstatus")) {
    return "Alle lokalen Grundfunktionen sind online.";
  }

  if (q.includes("danke")) {
    return "Sehr gerne, Herr Kathmann.";
  }

  return "Ich habe Ihre Nachricht empfangen. Meine lokalen Funktionen sind aktiv. Eine echte KI-Anbindung ist noch nicht eingerichtet.";
}

// NACHRICHT SENDEN

function send() {
  const input = document.getElementById("message");
  const text = input.value.trim();

  if (!text) return;

  addMessage("Sie: " + text, "user");
  input.value = "";

  const answer = think(text);

  addMessage("J.A.R.V.I.S.: " + answer, "jarvis");
  speak(answer);
}

// SPRACHERKENNUNG

function listen() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    addMessage(
      "J.A.R.V.I.S.: Die Spracherkennung wird von diesem Browser nicht unterstützt.",
      "jarvis"
    );
    return;
  }

  if (listening && recognition) {
    recognition.stop();
    return;
  }

  recognition = new Recognition();

  recognition.lang = "de-DE";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = function() {
    listening = true;
    document.getElementById("systemStatus").textContent =
      "SPRACHERKENNUNG AKTIV";
  };

  recognition.onresult = function(event) {
    const result =
      event.results[0][0].transcript;

    document.getElementById("message").value = result;

    send();
  };

  recognition.onerror = function() {
    addMessage(
      "J.A.R.V.I.S.: Mikrofon konnte nicht verwendet werden.",
      "jarvis"
    );
  };

  recognition.onend = function() {
    listening = false;
    document.getElementById("systemStatus").textContent =
      "SYSTEM ONLINE";
  };

  try {
    recognition.start();
  } catch (error) {
    addMessage(
      "J.A.R.V.I.S.: Spracherkennung konnte nicht gestartet werden.",
      "jarvis"
    );
  }
}

// GEDÄCHTNIS SPEICHERN

function getMemories() {
  try {
    return JSON.parse(
      localStorage.getItem("jarvisMemory") || "[]"
    );
  } catch (error) {
    return [];
  }
}

function saveMemory() {
  const input = document.getElementById("message");
  const value = input.value.trim();

  if (!value) {
    addMessage(
      "J.A.R.V.I.S.: Bitte zuerst eine Information eingeben.",
      "jarvis"
    );
    return;
  }

  const memories = getMemories();
  memories.push(value);

  localStorage.setItem(
    "jarvisMemory",
    JSON.stringify(memories)
  );

  input.value = "";

  const answer = "Information wurde in meinem lokalen Gedächtnis gespeichert.";

  addMessage("J.A.R.V.I.S.: " + answer, "jarvis");
  speak(answer);
}

// GEDÄCHTNIS ANZEIGEN

function showMemory() {
  const memories = getMemories();

  const answer = memories.length
    ? memories.join(" | ")
    : "Mein Gedächtnis ist noch leer.";

  addMessage("J.A.R.V.I.S.: " + answer, "jarvis");
  speak(answer);
}

// GEDÄCHTNIS LÖSCHEN

function deleteMemory() {
  localStorage.removeItem("jarvisMemory");

  const answer = "Mein lokales Gedächtnis wurde gelöscht.";

  addMessage("J.A.R.V.I.S.: " + answer, "jarvis");
  speak(answer);
}

// SYSTEMSTATUS

function jarvisStatus() {
  const answer =
    "Systemstatus: Online. Chat, Gedächtnis und lokale Sprachfunktionen sind bereit.";

  addMessage("J.A.R.V.I.S.: " + answer, "jarvis");
  speak(answer);
}

// ENTER-TASTE

document.getElementById("message").addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") {
      send();
    }
  }
);

</script>

</body>
</html>
