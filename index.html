
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071321">
<title>J.A.R.V.I.S.</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#071321;color:#d9f6ff;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;justify-content:center;
}
.app{width:100%;max-width:850px;padding:20px}
header{text-align:center;padding:20px}
h1{letter-spacing:8px;color:#42d9ff}
.status{color:#62e6a7;font-size:13px}
.core{
 width:150px;height:150px;border-radius:50%;
 margin:20px auto;
 border:4px solid #28c9ff;
 box-shadow:0 0 25px #159bdc,inset 0 0 25px #159bdc;
 display:flex;align-items:center;justify-content:center;
 animation:pulse 3s infinite;
}
.core span{font-size:35px;font-weight:bold}
@keyframes pulse{
 50%{box-shadow:0 0 45px #28c9ff,inset 0 0 35px #159bdc}
}
.chat{
 height:350px;overflow-y:auto;
 border:1px solid #174d68;border-radius:12px;
 padding:15px;background:#091a2b;
}
.message{margin:12px 0;padding:12px;border-radius:9px;line-height:1.5}
.user{background:#123e59;text-align:right}
.jarvis{background:#102b3e}
.system{color:#83b9ce;font-size:13px;text-align:center}
.controls{display:flex;gap:8px;margin-top:12px}
input{
 flex:1;min-width:0;padding:14px;
 background:#10283b;color:white;
 border:1px solid #28799b;border-radius:8px;
 font-size:16px
}
button{
 background:#087da8;color:white;border:0;
 border-radius:8px;padding:12px;cursor:pointer;
 font-size:14px
}
button:hover{background:#119fce}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tools button{background:#17384d}
footer{text-align:center;color:#527d91;font-size:12px;margin:20px}
</style>
</head>

<body>
<div class="app">

<header>
<h1>J.A.R.V.I.S.</h1>
<div class="status" id="status">SYSTEM STARTET ...</div>
</header>

<div class="core"><span>J</span></div>

<div class="chat" id="chat">
<div class="message jarvis">
Guten Abend, Herr Kathmann. J.A.R.V.I.S. ist bereit.
</div>
</div>

<div class="controls">
<input id="input" placeholder="Nachricht an J.A.R.V.I.S. ..." autocomplete="off">
<button onclick="send()">Senden</button>
<button onclick="listen()">🎙️</button>
</div>

<div class="tools">
<button onclick="showMemory()">Gedächtnis anzeigen</button>
<button onclick="saveMemory()">Gedächtnis speichern</button>
<button onclick="clearChat()">Chat löschen</button>
<button onclick="stopSpeaking()">Sprache stoppen</button>
</div>

<footer>J.A.R.V.I.S. PERSONAL ASSISTANT</footer>
</div>

<script>
const API = "https://jarvis-assistant.jeremy-rohlfs.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const statusText = document.getElementById("status");

let history = JSON.parse(localStorage.getItem("jarvisChat") || "[]");
let memory = JSON.parse(localStorage.getItem("jarvisMemory") || "[]");

function addMessage(text, type="jarvis"){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function saveChat(){
 localStorage.setItem("jarvisChat",JSON.stringify(history));
}

function renderChat(){
 chat.innerHTML="";
 history.forEach(item=>addMessage(item.text,item.type));
}

function speak(text){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="de-DE";
 utterance.rate=1;
 speechSynthesis.speak(utterance);
}

function stopSpeaking(){
 if("speechSynthesis" in window)speechSynthesis.cancel();
}

async function checkStatus(){
 try{
  const response=await fetch(API+"/api/status");
  if(!response.ok)throw new Error();
  const data=await response.json();
  statusText.textContent=data.online
   ?"SYSTEM ONLINE"
   :"SYSTEM NICHT VERFÜGBAR";
 }catch(error){
  statusText.textContent="VERBINDUNG FEHLGESCHLAGEN";
 }
}

async function send(){
 const text=input.value.trim();
 if(!text)return;

 input.value="";
 history.push({text,type:"user"});
 addMessage(text,"user");
 saveChat();

 statusText.textContent="J.A.R.V.I.S. DENKT ...";

 try{
  const response=await fetch(API+"/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:text,
    history:history.slice(-20),
    memory:memory,
    assistant:"J.A.R.V.I.S.",
    user:"Herr Kathmann"
   })
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.message || "KI-Dienst ist noch nicht angeschlossen.");
  }

  const answer=data.reply || data.response || data.message;

  if(!answer)throw new Error("Der KI-Dienst hat keine Antwort geliefert.");

  history.push({text:answer,type:"jarvis"});
  addMessage(answer);
  saveChat();
  speak(answer);
  statusText.textContent="SYSTEM ONLINE";

 }catch(error){
  const answer="Herr Kathmann, die Verbindung zur KI ist noch nicht vollständig eingerichtet. Die API antwortet, aber der KI-Dienst liefert noch keine Antwort.";
  history.push({text:answer,type:"jarvis"});
  addMessage(answer);
  saveChat();
  statusText.textContent="KI-DIENST NICHT VERFÜGBAR";
 }
}

function saveMemory(){
 const text=prompt("Was soll ich mir merken?");
 if(!text)return;
 memory.push(text);
 localStorage.setItem("jarvisMemory",JSON.stringify(memory));
 addMessage("Verstanden, Herr Kathmann. Ich habe diese Information lokal gespeichert.");
}

function showMemory(){
 if(memory.length===0){
  addMessage("Mein Gedächtnis ist momentan leer.");
  return;
 }
 addMessage("Gespeicherte Erinnerungen:\n"+memory.join("\n"));
}

function clearChat(){
 if(!confirm("Chatverlauf wirklich löschen?"))return;
 history=[];
 localStorage.removeItem("jarvisChat");
 chat.innerHTML="";
 addMessage("Chatverlauf gelöscht. Ich bin wieder bereit.");
}

function listen(){
 const Recognition=window.SpeechRecognition || window.webkitSpeechRecognition;
 if(!Recognition){
  addMessage("Spracherkennung wird von diesem Browser nicht unterstützt.");
  return;
 }
 const recognition=new Recognition();
 recognition.lang="de-DE";
 recognition.interimResults=false;
 recognition.onstart=()=>statusText.textContent="ICH HÖRE ZU ...";
 recognition.onresult=(event)=>{
  input.value=event.results[0][0].transcript;
  send();
 };
 recognition.onerror=()=>statusText.textContent="SPRACHERKENNUNG FEHLGESCHLAGEN";
 recognition.onend=()=>checkStatus();
 recognition.start();
}

input.addEventListener("keydown",event=>{
 if(event.key==="Enter")send();
});

renderChat();
checkStatus();
</script>
</body>
</html>
